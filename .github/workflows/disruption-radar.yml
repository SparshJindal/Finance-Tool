name: Disruption Radar Automation

on:
  schedule:
    # Run Ingest Pipeline every 2 hours
    - cron: '0 */2 * * *'
    
    # Run Digest Pipeline at 2:30 AM UTC (8:00 AM IST)
    - cron: '30 2 * * *'

  # Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      job_to_run:
        description: 'Which job to run manually?'
        required: true
        default: 'ingest'
        type: choice
        options:
          - ingest
          - digest

jobs:
  ingest-news:
    name: Run Ingestion Pipeline (Every 2 Hours)
    # Run automatically via schedule OR manually if 'ingest' is selected
    if: github.event_name == 'schedule' && github.event.schedule == '0 */2 * * *' || github.event.inputs.job_to_run == 'ingest'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Ingest Script
        run: npx tsx scripts/ingest.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          RELEVANCE_THRESHOLD: ${{ secrets.RELEVANCE_THRESHOLD }}

  send-digest:
    name: Send Daily Digest (8:00 AM IST)
    # Run automatically via schedule OR manually if 'digest' is selected
    if: github.event_name == 'schedule' && github.event.schedule == '30 2 * * *' || github.event.inputs.job_to_run == 'digest'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Digest Script
        run: npx tsx scripts/digest.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
